# ===== Base de datos =====
# En local usa MySQL de XAMPP. En Azure se definen DB_URL, DB_USERNAME y DB_PASSWORD
# como "Configuración de la aplicación" del App Service (no se guardan en el código).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/floreria}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# ===== Servidor =====
server.port=${PORT:8080}

# ===== Configuración propia de la florería =====
# Orígenes que pueden consumir la API (Angular en desarrollo). En Azure el frontend
# se sirve desde el mismo dominio, así que no necesita CORS.
floreria.cors.origenes=${CORS_ORIGINS:http://localhost:4200}
# Contraseña inicial del usuario admin (cámbiala en Azure con ADMIN_PASSWORD)
floreria.admin.password=${ADMIN_PASSWORD:1234}
# Carga el catálogo de ejemplo si la tabla flores está vacía
floreria.seed-catalogo=${SEED_CATALOGO:true}
