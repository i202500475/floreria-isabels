<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Producto | Isabel's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --isabel-pink: #ff4d6d; --soft-bg: #fdf2f4; }
        body { background-color: var(--soft-bg); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; }
        .glass-form { 
            background: white; border-radius: 30px; border: none; 
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.1); overflow: hidden;
        }
        .form-header { background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%); padding: 40px; color: white; text-align: center; }
        .form-control { 
            border-radius: 12px; padding: 12px 18px; border: 1px solid #eee; 
            transition: 0.3s; background-color: #f8f9fa;
        }
        .form-control:focus { border-color: var(--isabel-pink); box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.1); background-color: white; }
        .btn-save { 
            background: var(--isabel-pink); border: none; border-radius: 15px; 
            padding: 15px 30px; font-weight: 700; transition: 0.3s;
        }
        .btn-save:hover { background: #e63958; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 77, 109, 0.2); }
        .img-preview { 
            width: 100%; height: 180px; object-fit: cover; border-radius: 20px; 
            margin-bottom: 20px; border: 2px dashed #ddd;
        }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <div class="glass-form mx-auto" style="max-width: 800px;">
            <div class="row g-0">
                <!-- Columna de Previsualización -->
                <div class="col-md-4 bg-light p-4 d-flex flex-column align-items-center justify-content-center border-end">
                    <p class="text-muted small fw-bold text-uppercase mb-3">Previsualización</p>
                    <img id="preview" th:src="*{imagenUrl != null ? imagenUrl : 'https://via.placeholder.com/300x300?text=Sin+Imagen'}" class="img-preview shadow-sm">
                    <div class="text-center">
                        <span class="badge bg-white text-dark shadow-sm rounded-pill px-3 py-2 border">Modo Editor</span>
                    </div>
                </div>
                <!-- Columna del Formulario -->
                <div class="col-md-8 p-4 p-lg-5">
                    <div class="mb-4">
                        <h3 class="fw-bold text-dark" th:text="${flor.id == null ? 'Nueva Creación' : 'Editar Detalle'}"></h3>
                        <p class="text-muted small">Completa los campos para actualizar el catálogo.</p>
                    </div>
                    
                    <form th:action="@{/admin/guardar}" th:object="${flor}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Nombre del arreglo</label>
                            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Rosas Eternas Premium" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Descripción </label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="2" placeholder="Ej: Un detalle que cautiva los sentidos..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold text-secondary">Precio (S/)</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0 bg-white">S/</span>
                                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold text-secondary">Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">URL de la Imagen</label>
                            <input type="text" id="urlInput" th:field="*{imagenUrl}" class="form-control" placeholder="https://..." required>
                        </div>

                        <div class="d-flex gap-3 mt-5">
                            <button type="submit" class="btn btn-save text-white flex-grow-1">
                                <i class="bi bi-cloud-arrow-up-fill me-2"></i>
                                <span th:text="${flor.id == null ? 'Publicar Flor' : 'Guardar Cambios'}"></span>
                            </button>
                            <a th:href="@{/admin/dashboard}" class="btn btn-light rounded-4 px-4 d-flex align-items-center border">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Script para previsualización dinámica
        const input = document.getElementById('urlInput');
        const img = document.getElementById('preview');
        input.addEventListener('input', () => {
            img.src = input.value || 'https://via.placeholder.com/300x300?text=Sin+Imagen';
        });
    </script>
</body>
</html>
