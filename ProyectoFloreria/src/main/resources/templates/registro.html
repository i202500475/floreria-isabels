<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Isabel'S - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Degradado suave para que no se vea "muy blanco" */
            background: linear-gradient(135deg, #fff5f7 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-registro {
            border: none;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.15); /* Sombra rosada sutil */
        }
        .btn-registro {
            background-color: #ff4d6d;
            border: none;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-registro:hover {
            background-color: #ff758f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #ffe0e6;
            padding: 12px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25 intern rgba(255, 77, 109, 0.25);
            border-color: #ff4d6d;
        }
        .titulo-3d {
            color: #333;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-registro p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <h2 class="titulo-3d">🌸 Isabel'S 🌸</h2>
                        <p class="text-muted">Crea tu cuenta para recibir tus vouchers y ofertas especiales.</p>
                    </div>

                    <div th:if="${param.error != null and param.error[0] == 'existe'}" class="alert alert-danger py-2">Ese nombre de usuario ya está registrado.</div>
                    <div th:if="${param.error != null and param.error[0] == 'datos'}" class="alert alert-danger py-2">Completa usuario y una contraseña de al menos 4 caracteres.</div>
                    <form th:action="@{/registro/guardar}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" name="nombreCompleto" class="form-control" placeholder="....." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" name="correo" class="form-control" placeholder="ejemplo@gmail.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Usuario</label>
                            <input type="text" name="username" class="form-control" placeholder="......" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="Mínimo 4 caracteres" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección de Entrega</label>
                            <textarea name="direccion" class="form-control" rows="2" placeholder="Av. Principal 123..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-registro w-100 p-3 mt-3">
                            REGISTRARME AHORA
                        </button>
                        
                        <div class="text-center mt-4">
                            <a th:href="@{/login}" class="text-decoration-none" style="color: #ff4d6d;">¿Ya tienes cuenta? Inicia sesión aquí</a>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a th:href="@{/}" class="text-muted text-decoration-none small">← Volver a la florería</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
