<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Compra | Isabel's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --deep-pink: #ff4d6d; --soft-pink: #fff0f3; }
        body { 
            background: linear-gradient(135deg, #fff0f3 0%, #fdfcfc 100%); 
            min-height: 100vh; 
            font-family: 'Poppins', sans-serif;
        }
        .card-pago { 
            border: none; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.15); 
            overflow: hidden; 
            background: white;
        }
        .resumen-lado { 
            background: linear-gradient(180deg, var(--deep-pink) 0%, #ff758c 100%); 
            color: white; 
            padding: 50px 40px; 
        }
        .img-flor-checkout {
            width: 180px; height: 180px; 
            object-fit: cover; 
            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .price-row {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
        }
        .form-lado { padding: 50px; background: white; }
        .form-label { font-weight: 600; color: #444; font-size: 0.9rem; }
        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 2px solid #f8f9fa;
            background: #f8f9fa;
            transition: 0.3s;
        }
        .form-control:focus {
            background: white;
            border-color: var(--deep-pink);
            box-shadow: none;
        }
        .metodo-pago { 
            border: 2px solid #f0f0f0; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: 0.3s;
            padding: 20px !important;
        }
        .metodo-pago.active { 
            border-color: var(--deep-pink); 
            background: var(--soft-pink);
            color: var(--deep-pink);
        }
        .btn-final { 
            background: var(--deep-pink); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 15px; 
            width: 100%; 
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            transition: 0.3s;
        }
        .btn-final:hover { background: #e63958; transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 77, 109, 0.4); color: white; }
        .qr-container {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-11 col-xl-10">
                <div class="card card-pago flex-column flex-md-row">
                    
                    <div class="col-md-5 resumen-lado text-center d-flex flex-column justify-content-center">
                        <h2 class="mb-4 fw-bold" style="font-family: 'Playfair Display', serif;">Tu Detalle</h2>
                        <div class="mb-4">
                            <img th:src="${flor.imagenUrl}" class="img-flor-checkout mb-3" alt="Flor">
                            <h3 class="fw-bold mb-1" th:text="${flor.nombre}">Nombre</h3>
                            <span class="badge rounded-pill bg-white text-danger px-3 py-2">Envío Express Gratis</span>
                        </div>
                        <div class="price-row mx-auto w-100" style="max-width: 300px;">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="opacity-75">Subtotal</span>
                                <span th:text="'S/ ' + ${flor.precio}"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="opacity-75">Delivery</span>
                                <span>Gratis</span>
                            </div>
                            <hr class="my-2" style="border-top: 1px solid rgba(255,255,255,0.3);">
                            <div class="d-flex justify-content-between fw-bold fs-4">
                                <span>Total</span>
                                <span th:text="'S/ ' + ${flor.precio}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-7 form-lado">
                        <div class="mb-4">
                            <h4 class="fw-bold text-dark mb-1">Información de Entrega</h4>
                            <p class="text-muted small">Completa los datos para llevar tu sorpresa.</p>
                        </div>
                        
                        <form th:action="@{/procesar-pago}" method="post">
                            <input type="hidden" name="florId" th:value="${flor.id}">
                            <input type="hidden" name="metodo" id="metodoSeleccionado" value="yape">
                            
                            <div class="mb-4">
                                <label class="form-label text-uppercase small">Dirección de Destino</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-geo-alt text-danger"></i></span>
                                    <input type="text" name="direccion" class="form-control" placeholder="Ej: Av. Surco 123" required>
                                </div>
                            </div>

                            <label class="form-label text-uppercase small">Elige cómo pagar</label>
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <div id="btn-yape" class="metodo-pago text-center active" onclick="showMethod('yape')">
                                        <i class="bi bi-qr-code-scan d-block fs-2 mb-2"></i>
                                        <span class="fw-bold">Yape / Plin</span>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div id="btn-tarjeta" class="metodo-pago text-center" onclick="showMethod('tarjeta')">
                                        <i class="bi bi-credit-card-2-back d-block fs-2 mb-2"></i>
                                        <span class="fw-bold">Tarjeta</span>
                                    </div>
                                </div>
                            </div>

                            <div id="yape-section" class="text-center bg-light p-4 rounded-4 mb-4 border border-light">
                                <p class="small fw-bold text-muted mb-3">Escanea para pagar</p>
                                <div class="qr-container">
                                    <img src="/img/QRwsp.jpeg" style="width: 160px; height: 160px; object-fit: contain;">
                                </div>
                            </div>

                            <div id="tarjeta-section" class="d-none">
                                <div class="mb-3">
                                    <input type="text" class="form-control" placeholder="Número de tarjeta">
                                </div>
                                <div class="row g-3 mb-4">
                                    <div class="col-6"><input type="text" class="form-control" placeholder="MM/YY"></div>
                                    <div class="col-6"><input type="password" class="form-control" placeholder="CVV"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn-final">
                                <i class="bi bi-lock-fill me-2"></i> Confirmar Pago
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showMethod(method) {
            // Actualiza el input oculto para el controlador de Java
            document.getElementById('metodoSeleccionado').value = method;
            
            // UI Toggle
            document.getElementById('yape-section').classList.toggle('d-none', method !== 'yape');
            document.getElementById('tarjeta-section').classList.toggle('d-none', method !== 'tarjeta');
            document.getElementById('btn-yape').classList.toggle('active', method === 'yape');
            document.getElementById('btn-tarjeta').classList.toggle('active', method === 'tarjeta');
        }
    </script>
</body>
</html>
