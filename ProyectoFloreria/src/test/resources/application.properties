# Configuración SOLO para las pruebas: base de datos H2 en memoria.
# Así las pruebas no tocan la base MySQL real "floreria".
spring.datasource.url=jdbc:h2:mem:floreria_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
floreria.seed-catalogo=false
