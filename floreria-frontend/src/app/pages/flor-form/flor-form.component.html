<a routerLink="/admin/flores" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Volver</a>

<div class="card tarjeta p-4 p-md-5 mt-3 mx-auto" style="max-width: 620px">
  <h2 class="mb-4">{{ id ? 'Editar flor' : 'Nueva flor' }}</h2>

  <form #f="ngForm" (ngSubmit)="guardar()">
    <div class="mb-3">
      <label class="form-label" for="nombre">Nombre</label>
      <input id="nombre" name="nombre" class="form-control" [(ngModel)]="flor.nombre" required maxlength="100" #n="ngModel">
      @if (n.invalid && n.touched) { <div class="text-danger small">El nombre es obligatorio.</div> }
    </div>
    <div class="mb-3">
      <label class="form-label" for="desc">Descripción</label>
      <textarea id="desc" name="descripcion" class="form-control" rows="2" [(ngModel)]="flor.descripcion" maxlength="255"></textarea>
    </div>
    <div class="row">
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="precio">Precio (S/)</label>
        <input id="precio" name="precio" type="number" step="0.10" class="form-control" [(ngModel)]="flor.precio" required min="0.1" #pr="ngModel">
        @if (pr.invalid && pr.touched) { <div class="text-danger small">El precio debe ser mayor a 0.</div> }
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="stock">Stock</label>
        <input id="stock" name="stock" type="number" class="form-control" [(ngModel)]="flor.stock" required min="0" #st="ngModel">
        @if (st.invalid && st.touched) { <div class="text-danger small">El stock no puede ser negativo.</div> }
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="img">URL de la imagen</label>
      <input id="img" name="imagenUrl" class="form-control" [(ngModel)]="flor.imagenUrl" placeholder="https://...">
      @if (flor.imagenUrl) {
        <img [src]="flor.imagenUrl" alt="Vista previa" class="mt-2 rounded" style="max-height: 140px">
      }
    </div>

    @if (error()) {
      <div class="alert alert-danger py-2 small">{{ error() }}</div>
    }

    <button class="btn btn-rosa" type="submit" [disabled]="f.invalid || guardando()">
      {{ guardando() ? 'Guardando...' : (id ? 'Guardar cambios' : 'Registrar flor') }}
    </button>
  </form>
</div>
